name: Native and Flutter PR Gate

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.8"
          cache-dependency-path: native/frpc_cert/go.mod

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install pinned Android NDK
        working-directory: .
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          --install "ndk;28.2.13676358"

      - name: Check tracked sensitive filenames
        working-directory: .
        run: ./scripts/security_check.sh --tracked

      - name: Format and test Go certificate engine
        working-directory: native/frpc_cert
        run: |
          test -z "$(gofmt -l .)"
          go test -race ./...
          go vet ./...

      - name: Rebuild and verify embedded frpc
        working-directory: .
        run: ./scripts/build_frpc_android.sh --check

      - name: Audit Go vulnerability reachability
        working-directory: .
        run: ./scripts/audit_go_vulnerabilities.sh

      - name: Build Linux certificate bundle tool
        working-directory: .
        run: ./scripts/build_frpc_cert_tool.sh

      - name: Rebuild and verify Android certificate engine
        working-directory: .
        run: ./scripts/build_frpc_cert_android.sh --check

      - name: Test release native hash pin guard
        working-directory: .
        run: ./scripts/test_release_native_hashes.sh

      - name: Test release tag guard
        working-directory: .
        run: ./scripts/test_release_tag_guard.sh

      - name: Run real frpc/frps mutual TLS end-to-end test
        working-directory: .
        run: ./scripts/test_mtls_e2e.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Enforce formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Android lint
        run: ./android/gradlew -p android app:lintDebug --no-daemon

      - name: Build x86_64 frpc lifecycle test fixture
        working-directory: .
        run: ./scripts/build_frpc_test_stub_android.sh

      - name: Compile Android integration tests
        run: >-
          ./android/gradlew -p android app:assembleDebugAndroidTest
          -Pfrp.integrationTestAbi=x86_64 --no-daemon

      - name: Install Android API 35 emulator
        working-directory: .
        run: |
          set -Eeuo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          "$sdkmanager" --install \
            "emulator" \
            "platform-tools" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"
          printf 'no\n' | "$avdmanager" create avd \
            --force \
            --name frp-ci-api35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_5

      - name: Run Android integration tests on API 35
        working-directory: .
        timeout-minutes: 20
        env:
          ANDROID_SERIAL: emulator-5554
        run: |
          set -Eeuo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
          fi

          "$adb" start-server
          emulator_log="$RUNNER_TEMP/frp-api35-emulator.log"
          "$ANDROID_HOME/emulator/emulator" \
            -avd frp-ci-api35 \
            -port 5554 \
            -no-snapshot-load \
            -no-snapshot-save \
            -no-window \
            -gpu swiftshader_indirect \
            -noaudio \
            -no-boot-anim \
            -camera-back none \
            -camera-front none \
            >"$emulator_log" 2>&1 &
          emulator_pid=$!

          cleanup() {
            rc=$?
            if (( rc != 0 )); then
              tail -n 200 "$emulator_log" || true
            fi
            "$adb" -s "$ANDROID_SERIAL" emu kill >/dev/null 2>&1 || true
            kill "$emulator_pid" >/dev/null 2>&1 || true
            wait "$emulator_pid" 2>/dev/null || true
            exit "$rc"
          }
          trap cleanup EXIT

          device_connected=false
          for _ in $(seq 1 60); do
            device_state="$("$adb" -s "$ANDROID_SERIAL" get-state 2>/dev/null || true)"
            if [[ "$device_state" == "device" ]]; then
              device_connected=true
              break
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              printf '%s\n' 'Android emulator exited before connecting to adb.' >&2
              exit 1
            fi
            sleep 2
          done
          if [[ "$device_connected" != true ]]; then
            printf '%s\n' 'Timed out waiting for the Android emulator to connect to adb.' >&2
            exit 1
          fi

          boot_completed=false
          for _ in $(seq 1 120); do
            if [[ "$("$adb" -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              boot_completed=true
              break
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              printf '%s\n' 'Android emulator exited before completing boot.' >&2
              exit 1
            fi
            sleep 2
          done
          if [[ "$boot_completed" != true ]]; then
            printf '%s\n' 'Timed out waiting for the Android emulator to boot.' >&2
            exit 1
          fi

          "$adb" -s "$ANDROID_SERIAL" shell settings put global window_animation_scale 0
          "$adb" -s "$ANDROID_SERIAL" shell settings put global transition_animation_scale 0
          "$adb" -s "$ANDROID_SERIAL" shell settings put global animator_duration_scale 0
          ./scripts/build_frpc_test_stub_android.sh
          ./flutter_app/android/gradlew -p flutter_app/android connectedDebugAndroidTest \
            -Pfrp.integrationTestAbi=x86_64 --no-daemon

      - name: Build unsigned API 28+ Release APK
        env:
          FRP_RELEASE_MIN_SDK: '28'
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload Release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: frp-android-unsigned-release
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Linux certificate bundle tool
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: frpc-cert-tool-linux-amd64
          path: build/tools/linux-amd64/frpc-cert-tool
