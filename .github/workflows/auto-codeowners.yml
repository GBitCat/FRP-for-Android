name: Auto Codeowners
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  auto-codeowners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: mszostok/codeowners-validator@v0.7.4
        with:
          checks: "files,duppatterns,syntax"
