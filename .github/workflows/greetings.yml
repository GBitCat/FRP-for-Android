name: Greetings
on:
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.0.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: "Hello! Welcome to FRP Android. Thank you for opening your first issue."
          pr_message: "Hello! Welcome to FRP Android. Thank you for opening your first pull request."
