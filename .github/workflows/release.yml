name: Release (Flutter)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.1.2 (tag will be v0.1.2)'
        required: true
        default: '0.1.2'
      version_code:
        description: 'Monotonically increasing Android version code'
        required: true
        default: '12'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: release
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_VERSION_CODE: ${{ inputs.version_code }}
      SIGNING_MIGRATION_APPROVED: ${{ vars.FRP_SIGNING_MIGRATION_APPROVED }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      - name: Grant execute permission
        run: chmod +x flutter_app/android/gradlew

      - name: Validate release inputs
        shell: bash
        run: |
          test "$SIGNING_MIGRATION_APPROVED" = "true"
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          (( RELEASE_VERSION_CODE <= 2100000000 ))

      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.FRP_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.FRP_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.FRP_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.FRP_RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.FRP_RELEASE_CERT_SHA256 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          test -n "$RELEASE_CERT_SHA256"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/frp-release.keystore"

      - name: Analyze, test and build release APK
        working-directory: flutter_app
        env:
          FRP_RELEASE_STORE_FILE: ${{ runner.temp }}/frp-release.keystore
          FRP_RELEASE_STORE_PASSWORD: ${{ secrets.FRP_RELEASE_STORE_PASSWORD }}
          FRP_RELEASE_KEY_ALIAS: ${{ secrets.FRP_RELEASE_KEY_ALIAS }}
          FRP_RELEASE_KEY_PASSWORD: ${{ secrets.FRP_RELEASE_KEY_PASSWORD }}
          FRP_RELEASE_CERT_SHA256: ${{ secrets.FRP_RELEASE_CERT_SHA256 }}
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          flutter build apk --release --target-platform android-arm64 \
            --build-name "$RELEASE_VERSION" --build-number "$RELEASE_VERSION_CODE"
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          actual_digest=$("$apksigner" verify --print-certs "$apk" | sed -n \
            's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')
          expected_digest=$(printf '%s' "$FRP_RELEASE_CERT_SHA256" | \
            tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test -n "$actual_digest"
          test "$actual_digest" = "$expected_digest"

      - name: Delete temporary signing key
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/frp-release.keystore"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }} 🌈
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
