name: Release (Flutter)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.1.9 (tag will be v0.1.9)'
        required: true
        default: '0.1.9'
      version_code:
        description: 'Monotonically increasing Android version code'
        required: true
        default: '13'

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: release
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_VERSION_CODE: ${{ inputs.version_code }}
      SIGNING_MIGRATION_APPROVED: ${{ vars.FRP_SIGNING_MIGRATION_APPROVED }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install Android SDK components
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
          yes | "$sdkmanager" --licenses || true

      - name: Grant execute permission
        run: chmod +x flutter_app/android/gradlew

      - name: Validate release inputs
        shell: bash
        run: |
          test "$SIGNING_MIGRATION_APPROVED" = "true"
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          (( RELEASE_VERSION_CODE <= 2100000000 ))

      - name: Restore release signing key
        env:
          OLD_KEYSTORE_BASE64: ${{ secrets.FRP_RELEASE_OLD_KEYSTORE_BASE64 }}
          OLD_STORE_PASSWORD: ${{ secrets.FRP_RELEASE_OLD_STORE_PASSWORD }}
          OLD_KEY_ALIAS: ${{ secrets.FRP_RELEASE_OLD_KEY_ALIAS }}
          OLD_KEY_PASSWORD: ${{ secrets.FRP_RELEASE_OLD_KEY_PASSWORD }}
          OLD_CERT_SHA256: ${{ secrets.FRP_RELEASE_OLD_CERT_SHA256 }}
          NEW_KEYSTORE_BASE64: ${{ secrets.FRP_RELEASE_KEYSTORE_BASE64 }}
          NEW_STORE_PASSWORD: ${{ secrets.FRP_RELEASE_STORE_PASSWORD }}
          NEW_KEY_ALIAS: ${{ secrets.FRP_RELEASE_KEY_ALIAS }}
          NEW_KEY_PASSWORD: ${{ secrets.FRP_RELEASE_KEY_PASSWORD }}
          NEW_CERT_SHA256: ${{ secrets.FRP_RELEASE_CERT_SHA256 }}
          RELEASE_LINEAGE_BASE64: ${{ secrets.FRP_RELEASE_LINEAGE_BASE64 }}
        run: |
          test -n "$OLD_KEYSTORE_BASE64"
          test -n "$OLD_STORE_PASSWORD"
          test -n "$OLD_KEY_ALIAS"
          test -n "$OLD_KEY_PASSWORD"
          test -n "$OLD_CERT_SHA256"
          test -n "$NEW_KEYSTORE_BASE64"
          test -n "$NEW_STORE_PASSWORD"
          test -n "$NEW_KEY_ALIAS"
          test -n "$NEW_KEY_PASSWORD"
          test -n "$NEW_CERT_SHA256"
          test -n "$RELEASE_LINEAGE_BASE64"
          printf '%s' "$OLD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/frp-release-old.keystore"
          printf '%s' "$NEW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/frp-release-new.keystore"
          printf '%s' "$RELEASE_LINEAGE_BASE64" | base64 --decode > "$RUNNER_TEMP/frp-release-lineage.bin"
          chmod 600 "$RUNNER_TEMP"/frp-release-*

      - name: Analyze, test and build release APK
        working-directory: flutter_app
        env:
          OLD_STORE_PASSWORD: ${{ secrets.FRP_RELEASE_OLD_STORE_PASSWORD }}
          OLD_KEY_ALIAS: ${{ secrets.FRP_RELEASE_OLD_KEY_ALIAS }}
          OLD_KEY_PASSWORD: ${{ secrets.FRP_RELEASE_OLD_KEY_PASSWORD }}
          OLD_CERT_SHA256: ${{ secrets.FRP_RELEASE_OLD_CERT_SHA256 }}
          NEW_STORE_PASSWORD: ${{ secrets.FRP_RELEASE_STORE_PASSWORD }}
          NEW_KEY_ALIAS: ${{ secrets.FRP_RELEASE_KEY_ALIAS }}
          NEW_KEY_PASSWORD: ${{ secrets.FRP_RELEASE_KEY_PASSWORD }}
          NEW_CERT_SHA256: ${{ secrets.FRP_RELEASE_CERT_SHA256 }}
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          flutter build apk --release --target-platform android-arm64 \
            --build-name "$RELEASE_VERSION" --build-number "$RELEASE_VERSION_CODE"
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" sign \
            --lineage "$RUNNER_TEMP/frp-release-lineage.bin" \
            --rotation-min-sdk-version 28 \
            --v4-signing-enabled false \
            --ks "$RUNNER_TEMP/frp-release-old.keystore" \
            --ks-key-alias "$OLD_KEY_ALIAS" \
            --ks-pass env:OLD_STORE_PASSWORD \
            --key-pass env:OLD_KEY_PASSWORD \
            --next-signer \
            --ks "$RUNNER_TEMP/frp-release-new.keystore" \
            --ks-key-alias "$NEW_KEY_ALIAS" \
            --ks-pass env:NEW_STORE_PASSWORD \
            --key-pass env:NEW_KEY_PASSWORD \
            "$apk"

          old_actual=$("$apksigner" verify --verbose --print-certs \
            --min-sdk-version 24 --max-sdk-version 27 "$apk" | sed -n \
            's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')
          new_actual=$("$apksigner" verify --verbose --print-certs \
            --min-sdk-version 28 --max-sdk-version 36 "$apk" | sed -n \
            's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')
          old_expected=$(printf '%s' "$OLD_CERT_SHA256" | \
            tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          new_expected=$(printf '%s' "$NEW_CERT_SHA256" | \
            tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test -n "$old_actual"
          test -n "$new_actual"
          test "$old_actual" = "$old_expected"
          test "$new_actual" = "$new_expected"
          apk_dir=$(dirname "$apk")
          apk_name=$(basename "$apk")
          (cd "$apk_dir" && sha256sum "$apk_name" > "$apk_name.sha256")

      - name: Delete temporary signing key
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP"/frp-release-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }} 🌈
          files: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            flutter_app/build/app/outputs/flutter-apk/app-release.apk.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
