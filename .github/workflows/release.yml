name: Release (Flutter)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.1.9 (tag will be v0.1.9)'
        required: true
        default: '0.1.9'
      version_code:
        description: 'Monotonically increasing Android version code'
        required: true
        default: '13'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security-gate:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  build-unsigned:
    needs: [gate, security-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_VERSION_CODE: ${{ inputs.version_code }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      FRP_RELEASE_MIN_SDK: '28'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate immutable release inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          (( RELEASE_VERSION_CODE <= 2100000000 ))
          ./scripts/check_release_tag_absent.sh "$RELEASE_VERSION" origin

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install Android SDK components
        run: |
          set -Eeuo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
          yes | "$sdkmanager" --licenses || true

      - name: Build unsigned API 28+ release APK
        working-directory: flutter_app
        run: |
          set -Eeuo pipefail
          flutter pub get
          flutter build apk --release --target-platform android-arm64 \
            --build-name "$RELEASE_VERSION" --build-number "$RELEASE_VERSION_CODE"
          apk=build/app/outputs/flutter-apk/app-release.apk
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$aapt2" dump badging "$apk" | grep -q "minSdkVersion:'28'"
          (cd "$(dirname "$apk")" && sha256sum "$(basename "$apk")" > app-release.apk.sha256)

      - name: Upload unsigned release input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: release-unsigned-${{ github.run_id }}
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            flutter_app/build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 1

  sign-and-publish:
    needs: build-unsigned
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_VERSION_CODE: ${{ inputs.version_code }}
      SIGNING_MIGRATION_APPROVED: ${{ vars.FRP_SIGNING_MIGRATION_APPROVED }}
      REQUIRED_FRPC_SHA256: 1a5b096cac3241c490f89fa19121f59224ece4b93b30c48f6d078845b6805cb1
      REQUIRED_CERT_ENGINE_SHA256: 46f36078a94d62068dc8712e1d7a00047e6f6741c0b55617337191069760eda9
      REQUIRED_PREVIOUS_CERT_SHA256: 6bbcde4382b2422d950e46d077167571e0edee486c6db03eb622a7add8d270d8

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install isolated Android signing tools
        run: |
          set -Eeuo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --install "build-tools;36.0.0"
          yes | "$sdkmanager" --licenses || true

      - name: Download verified unsigned artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-unsigned-${{ github.run_id }}
          path: ${{ runner.temp }}/release-input

      - name: Verify unsigned artifact digest
        working-directory: ${{ runner.temp }}/release-input
        run: sha256sum --check --strict app-release.apk.sha256

      - name: Validate unsigned artifact policy before exposing signing keys
        run: |
          set -Eeuo pipefail
          apk="$RUNNER_TEMP/release-input/app-release.apk"
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -f "$apk"
          test -x "$aapt2"
          test -x "$apksigner"
          test "$(stat -c '%s' "$apk")" -le 157286400
          unzip -tqq "$apk"

          badging="$RUNNER_TEMP/unsigned-apk-badging.txt"
          "$aapt2" dump badging "$apk" > "$badging"
          grep -Fq "package: name='com.frp.frp_app' versionCode='$RELEASE_VERSION_CODE' versionName='$RELEASE_VERSION'" "$badging"
          grep -Fq "minSdkVersion:'28'" "$badging"
          grep -Fq "targetSdkVersion:'36'" "$badging"
          if grep -Fq 'application-debuggable' "$badging"; then
            echo 'Release input must not be debuggable' >&2
            exit 1
          fi
          if "$apksigner" verify --min-sdk-version 28 --max-sdk-version 36 "$apk" >/dev/null 2>&1; then
            echo 'Release input must be unsigned' >&2
            exit 1
          fi

          entries="$RUNNER_TEMP/unsigned-apk-entries.txt"
          unzip -Z1 "$apk" > "$entries"
          test -z "$(LC_ALL=C sort "$entries" | uniq -d)"
          if grep -Eq '(^|/)\.\.(/|$)|\\|^/' "$entries"; then
            echo 'Release input contains an unsafe ZIP entry name' >&2
            exit 1
          fi
          mapfile -t packaged_abis < <(
            awk -F/ '$1 == "lib" && NF >= 3 { print $2 }' "$entries" |
              LC_ALL=C sort -u
          )
          if (( ${#packaged_abis[@]} != 1 )) || [[ "${packaged_abis[0]}" != 'arm64-v8a' ]]; then
            printf 'Release input contains an invalid ABI set: %s\n' \
              "${packaged_abis[*]:-none}" >&2
            exit 1
          fi

          verify_native_hash() {
            local entry="$1"
            local expected="$2"
            test "$(grep -Fxc "$entry" "$entries")" -eq 1
            local actual
            actual="$(unzip -p "$apk" "$entry" | sha256sum | cut -d' ' -f1)"
            test "$actual" = "$expected"
          }
          verify_native_hash 'lib/arm64-v8a/libfrpc.so' "$REQUIRED_FRPC_SHA256"
          verify_native_hash 'lib/arm64-v8a/libfrpc_cert.so' "$REQUIRED_CERT_ENGINE_SHA256"

      - name: Validate signing lineage before exposing the private key
        env:
          CERT_SHA256: ${{ secrets.FRP_RELEASE_CERT_SHA256 }}
          RELEASE_LINEAGE_BASE64: ${{ secrets.FRP_RELEASE_LINEAGE_BASE64 }}
        run: |
          set -Eeuo pipefail
          test "$SIGNING_MIGRATION_APPROVED" = "true"
          test -n "$CERT_SHA256"
          test -n "$RELEASE_LINEAGE_BASE64"

          umask 077
          lineage="$RUNNER_TEMP/frp-release-lineage.bin"
          current_fingerprint="$RUNNER_TEMP/frp-release-cert.sha256"
          lineage_report="$RUNNER_TEMP/input-lineage.txt"
          printf '%s' "$RELEASE_LINEAGE_BASE64" | base64 --decode > "$lineage"

          normalize_fingerprint() {
            printf '%s' "$1" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]'
          }

          expected_previous="$(normalize_fingerprint "$REQUIRED_PREVIOUS_CERT_SHA256")"
          expected_current="$(normalize_fingerprint "$CERT_SHA256")"
          [[ "$expected_previous" =~ ^[0-9A-F]{64}$ ]]
          [[ "$expected_current" =~ ^[0-9A-F]{64}$ ]]
          printf '%s\n' "$expected_current" > "$current_fingerprint"
          chmod 0600 "$lineage" "$current_fingerprint"

          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" lineage --in "$lineage" --print-certs -v > "$lineage_report"
          chmod 0600 "$lineage_report"

          mapfile -t fingerprints < <(
            sed -n \
              's/^Signer #[0-9][0-9]* in lineage certificate SHA-256 digest: //p' \
              "$lineage_report" | tr -d ':' | tr '[:lower:]' '[:upper:]'
          )
          if (( ${#fingerprints[@]} != 2 )); then
            echo 'Signing lineage must contain exactly two certificates' >&2
            exit 1
          fi
          test "${fingerprints[0]}" = "$expected_previous"
          test "${fingerprints[1]}" = "$expected_current"

          awk '
            /^Signer #1 in lineage / { old = 1 }
            /^Signer #2 in lineage / { old = 0 }
            old && /^Has installed data capability:[[:space:]]*true$/ { installed++ }
            old && /^Has shared UID capability[[:space:]]*:[[:space:]]*false$/ { no_shared_uid++ }
            old && /^Has permission capability[[:space:]]*:[[:space:]]*true$/ { permission++ }
            old && /^Has rollback capability[[:space:]]*:[[:space:]]*false$/ { no_rollback++ }
            old && /^Has auth capability[[:space:]]*:[[:space:]]*false$/ { no_auth++ }
            END {
              exit !(installed == 1 && no_shared_uid == 1 && permission == 1 &&
                no_rollback == 1 && no_auth == 1)
            }
          ' "$lineage_report"
          test "$(stat -c '%a' "$lineage")" = '600'
          test "$(stat -c '%a' "$current_fingerprint")" = '600'
          test "$(stat -c '%a' "$lineage_report")" = '600'

      - name: Sign and verify with the rotated API 28+ signer
        env:
          KEYSTORE_BASE64: ${{ secrets.FRP_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FRP_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FRP_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FRP_RELEASE_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          umask 077
          keystore="$RUNNER_TEMP/frp-release.keystore"
          lineage="$RUNNER_TEMP/frp-release-lineage.bin"
          current_fingerprint="$RUNNER_TEMP/frp-release-cert.sha256"
          output_dir="$RUNNER_TEMP/release-output"
          input_apk="$RUNNER_TEMP/release-input/app-release.apk"
          output_apk="$output_dir/app-release.apk"
          trap 'rm -f -- "$keystore" "$lineage" "$current_fingerprint" \
            "$RUNNER_TEMP/input-lineage.txt" "$RUNNER_TEMP/output-lineage.txt" \
            "$RUNNER_TEMP/apksigner-verify.txt"' EXIT
          test "$(stat -c '%a' "$lineage")" = '600'
          test "$(stat -c '%a' "$current_fingerprint")" = '600'
          expected_previous="$(printf '%s' "$REQUIRED_PREVIOUS_CERT_SHA256" | \
            tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected_current="$(tr -d '[:space:]' < "$current_fingerprint")"
          [[ "$expected_previous" =~ ^[0-9A-F]{64}$ ]]
          [[ "$expected_current" =~ ^[0-9A-F]{64}$ ]]
          mkdir -p "$output_dir"
          install -m 0600 "$input_apk" "$output_apk"

          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          verify_lineage() {
            local input="$1"
            local report="$2"
            "$apksigner" lineage --in "$input" --print-certs -v > "$report"
            local -a fingerprints
            mapfile -t fingerprints < <(
              sed -n \
                's/^Signer #[0-9][0-9]* in lineage certificate SHA-256 digest: //p' \
                "$report" | tr -d ':' | tr '[:lower:]' '[:upper:]'
            )
            if (( ${#fingerprints[@]} != 2 )); then
              echo 'Signed APK must contain exactly the approved two-certificate lineage' >&2
              exit 1
            fi
            test "${fingerprints[0]}" = "$expected_previous"
            test "${fingerprints[1]}" = "$expected_current"
            awk '
              /^Signer #1 in lineage / { old = 1 }
              /^Signer #2 in lineage / { old = 0 }
              old && /^Has installed data capability:[[:space:]]*true$/ { installed++ }
              old && /^Has shared UID capability[[:space:]]*:[[:space:]]*false$/ { no_shared_uid++ }
              old && /^Has permission capability[[:space:]]*:[[:space:]]*true$/ { permission++ }
              old && /^Has rollback capability[[:space:]]*:[[:space:]]*false$/ { no_rollback++ }
              old && /^Has auth capability[[:space:]]*:[[:space:]]*false$/ { no_auth++ }
              END {
                exit !(installed == 1 && no_shared_uid == 1 && permission == 1 &&
                  no_rollback == 1 && no_auth == 1)
              }
            ' "$report"
          }

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$apksigner" sign \
            --lineage "$lineage" \
            --min-sdk-version 28 \
            --rotation-min-sdk-version 28 \
            --v1-signing-enabled false \
            --v2-signing-enabled false \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --ks "$keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            "$output_apk"

          verify_output="$RUNNER_TEMP/apksigner-verify.txt"
          "$apksigner" verify --verbose --print-certs \
            --min-sdk-version 28 --max-sdk-version 36 "$output_apk" | tee "$verify_output"
          grep -Fxq 'Verified using v1 scheme (JAR signing): false' "$verify_output"
          grep -Fxq 'Verified using v2 scheme (APK Signature Scheme v2): false' "$verify_output"
          grep -Fxq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$verify_output"
          grep -Fxq 'Number of signers: 1' "$verify_output"
          mapfile -t actual_signers < <(
            sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' \
              "$verify_output" | tr '[:lower:]' '[:upper:]'
          )
          test "${#actual_signers[@]}" -eq 1
          test "${actual_signers[0]}" = "$expected_current"
          verify_lineage "$output_apk" "$RUNNER_TEMP/output-lineage.txt"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$output_apk"
          (cd "$output_dir" && sha256sum app-release.apk > app-release.apk.sha256)

      - name: Attest signed APK build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-output/app-release.apk

      - name: Atomically reserve release tag at the audited commit
        id: reserve_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          tag="v$RELEASE_VERSION"
          response="$RUNNER_TEMP/reserved-release-tag.json"
          payload="$(printf '{\"ref\":\"refs/tags/%s\",\"sha\":\"%s\"}' \
            "$tag" "$GITHUB_SHA")"
          status="$(curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            --output "$response" \
            --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs")"
          if [[ "$status" != '201' ]]; then
            echo "Unable to reserve a new release tag (HTTP $status)" >&2
            exit 1
          fi
          printf 'created=true\n' >> "$GITHUB_OUTPUT"
          actual_ref="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["ref"])' "$response")"
          actual_sha="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["object"]["sha"])' "$response")"
          test "$actual_ref" = "refs/tags/$tag"
          test "$actual_sha" = "$GITHUB_SHA"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ inputs.version }} 🌈
          files: |
            ${{ runner.temp }}/release-output/app-release.apk
            ${{ runner.temp }}/release-output/app-release.apk.sha256
            ${{ steps.provenance.outputs.bundle-path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published tag still targets the audited commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          response="$RUNNER_TEMP/published-release-tag.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$response" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION"
          actual_sha="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["object"]["sha"])' "$response")"
          test "$actual_sha" = "$GITHUB_SHA"

      - name: Clean up an unused tag after failed publication
        if: ${{ failure() && steps.reserve_tag.outputs.created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          tag="v$RELEASE_VERSION"
          release_response="$RUNNER_TEMP/failed-release-lookup.json"
          set +e
          release_status="$(curl --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$release_response" \
            --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          curl_status=$?
          set -e
          if (( curl_status != 0 )); then
            echo 'Unable to determine whether publication created a release; retaining the tag for manual recovery.' >&2
            exit 0
          fi
          if [[ "$release_status" != '404' ]]; then
            echo "A release lookup returned HTTP $release_status; retaining the tag for manual inspection." >&2
            exit 0
          fi

          ref_response="$RUNNER_TEMP/failed-release-tag.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$ref_response" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$tag"
          actual_sha="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["object"]["sha"])' "$ref_response")"
          if [[ "$actual_sha" != "$GITHUB_SHA" ]]; then
            echo 'Reserved tag changed after creation; refusing automatic deletion.' >&2
            exit 0
          fi
          curl --fail --silent --show-error \
            --request DELETE \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
