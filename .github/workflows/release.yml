name: Release (Flutter)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.1.2 (tag will be v0.1.2)'
        required: true
        default: '0.1.2'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" || true
          yes | sdkmanager --licenses || true

      - name: Grant execute permission
        run: chmod +x flutter_app/gradlew

      - name: Build release APK
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }} 🌈
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
