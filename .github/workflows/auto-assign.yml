name: Auto Assign
on:
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    steps:
      - uses: pozil/auto-assign-issue@d6e511896e5f1d2408e74db74416647d8ff80c8c # v4
        with:
          assignees: gbitcat
          numOfAssignee: 1
