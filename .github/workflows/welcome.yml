name: Welcome
on:
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: "Hello! Welcome to FRP Android. Thank you for opening your first issue."
          pr_message: "Hello! Welcome to FRP Android. Thank you for opening your first pull request."
