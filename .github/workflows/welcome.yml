name: Welcome
on:
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Hello! Welcome to FRP Android. Thank you for opening your first issue."
          pr-message: "Hello! Welcome to FRP Android. Thank you for opening your first pull request."
