name: Auto Release Drafter
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-release-drafter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
