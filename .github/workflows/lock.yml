name: 'Lock threads'
on:
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@v6
        with:
          issue-inactive-days: '365'
          pr-inactive-days: '365'
          issue-lock-reason: 'resolved'
          pr-lock-reason: 'resolved'
