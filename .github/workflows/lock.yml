name: 'Lock threads'
on:
  schedule:
    - cron: '0 0 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/lock-threads@v3
        with:
          issue-inactive-days: '365'
          pr-inactive-days: '365'
          issue-lock-reason: 'resolved'
          pr-lock-reason: 'resolved'
