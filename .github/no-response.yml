# Configuration for probot-no-response - https://github.com/probot/no-response

# Number of days of inactivity before an Issue is closed for requiring more information
daysUntilClose: 14

# Label requiring a response
responseRequiredLabel: "needs-info"

# Comment to post when closing an Issue. Set to `false` to disable
closeComment: >
  This issue has been automatically closed because there has been no response
  to our request for more information from the original author.
  Please open a new issue if you have additional information to provide.
